<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Malinja College</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class", corePlugins: { preflight: false } };
    if (localStorage.getItem("crmsTheme") === "dark") {
      document.documentElement.classList.add("dark");
      document.documentElement.setAttribute("data-bs-theme", "dark");
    }
  </script>
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="dashboard" class="bg-gray-100 dark:bg-[#121820]">

  <div id="layout"></div>

  <main class="pt-16 px-4 pb-6 md:pt-6 md:px-6 md:ml-64">
    <h3 class="text-2xl font-semibold text-[#1f3a5f] dark:text-white mb-4">Dashboard</h3>

    <!-- Summary cards -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
      <div class="card text-center"><div class="card-body">
        <i class="bi bi-people text-3xl text-blue-500"></i>
        <h2 id="totalStudents" class="mb-0">0</h2>
        <p class="mb-0 text-secondary">Total Students</p>
      </div></div>
      <div class="card text-center"><div class="card-body">
        <i class="bi bi-door-closed text-3xl text-green-500"></i>
        <h2 id="totalRooms" class="mb-0">0</h2>
        <p class="mb-0 text-secondary">Total Rooms</p>
      </div></div>
      <div class="card text-center"><div class="card-body">
        <i class="bi bi-exclamation-circle text-3xl text-red-500"></i>
        <h2 id="totalComplaints" class="mb-0">0</h2>
        <p class="mb-0 text-secondary">Total Complaints</p>
      </div></div>
      <div class="card text-center"><div class="card-body">
        <i class="bi bi-calendar-event text-3xl text-orange-500"></i>
        <h2 id="totalActivities" class="mb-0">0</h2>
        <p class="mb-0 text-secondary">Total Activities</p>
      </div></div>
    </div>

    <!-- Bar chart and doughnut chart -->
    <div class="grid lg:grid-cols-2 gap-4 mb-4">
      <div class="card min-w-0"><div class="card-body">
        <h5 class="card-title">Complaints by Category</h5>
        <div class="h-64"><canvas id="barChart"></canvas></div>
      </div></div>
      <div class="card min-w-0"><div class="card-body">
        <h5 class="card-title">Complaints by Status</h5>
        <div class="h-64"><canvas id="pieChart"></canvas></div>
      </div></div>
    </div>

    <!-- Heatmap (ApexCharts) and quick overview -->
    <div class="grid lg:grid-cols-3 gap-4 mb-4">
      <div class="card min-w-0 lg:col-span-2"><div class="card-body">
        <h5 class="card-title">Complaints Heatmap (Category by Month)</h5>
        <div id="heatChart"></div>
      </div></div>

      <div class="card min-w-0"><div class="card-body">
        <h5 class="card-title">Quick Overview</h5>

        <p class="mb-1 mt-3">Room Occupancy: <strong id="occupancyText">0%</strong></p>
        <div class="progress mb-4" style="height: 14px;">
          <div id="occupancyBar" class="progress-bar bg-info" style="width: 0%"></div>
        </div>

        <p class="mb-1">Complaints Resolved: <strong id="resolvedText">0%</strong></p>
        <div class="progress" style="height: 14px;">
          <div id="resolvedBar" class="progress-bar bg-success" style="width: 0%"></div>
        </div>
      </div></div>
    </div>

    <!-- Recent complaints -->
    <div class="card"><div class="card-body">
      <h5 class="card-title">Recent Complaints</h5>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr><th>Student</th><th>Category</th><th>Date</th><th>Status</th></tr>
          </thead>
          <tbody id="recentTable"></tbody>
        </table>
      </div>
    </div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.1/dist/apexcharts.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
