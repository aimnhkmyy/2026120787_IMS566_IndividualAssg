<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback &amp; Rating - Malinja College</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class", corePlugins: { preflight: false } };
    if (localStorage.getItem("crmsTheme") === "dark") {
      document.documentElement.classList.add("dark");
      document.documentElement.setAttribute("data-bs-theme", "dark");
    }
  </script>
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="feedback" class="bg-gray-100 dark:bg-[#121820]">

  <div id="layout"></div>

  <main class="pt-16 px-4 pb-6 md:pt-6 md:px-6 md:ml-64">
    <h3 class="mb-1">Feedback &amp; Rating</h3>
    <p class="text-secondary mb-4">Tell us how Malinja College is doing.</p>

    <div class="grid lg:grid-cols-2 gap-4 mb-4">
      <div class="card"><div class="card-body">
        <h5 class="card-title">Rate your experience</h5>
        <div id="starBox" class="mb-3"></div>
        <input type="text" id="fbName" class="form-control mb-2" placeholder="Your name (optional)">
        <textarea id="fbText" class="form-control mb-3" rows="4" placeholder="What did you like? What can we improve?"></textarea>
        <button class="btn btn-primary" onclick="submitFeedback()">Send feedback</button>
      </div></div>

      <div class="card"><div class="card-body">
        <h5 class="card-title">Overall rating</h5>
        <div class="flex items-end gap-3 mb-3">
          <span id="fbAvg" style="font-size:3.5rem;font-weight:700;line-height:1">0.0</span>
          <span id="fbCount" class="text-secondary mb-1"></span>
        </div>
        <div id="fbBars"></div>
      </div></div>
    </div>

    <div class="card"><div class="card-body">
      <h5 class="card-title">What residents say</h5>
      <div id="fbList"></div>
    </div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
