<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complaint Management - Malinja College</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class", corePlugins: { preflight: false } };
    if (localStorage.getItem("crmsTheme") === "dark") {
      document.documentElement.classList.add("dark");
      document.documentElement.setAttribute("data-bs-theme", "dark");
    }
  </script>
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="complaints" class="bg-gray-100 dark:bg-[#121820]">

  <div id="layout"></div>

  <main class="pt-16 px-4 pb-6 md:pt-6 md:px-6 md:ml-64">
    <h3 class="text-2xl font-semibold text-[#1f3a5f] dark:text-white mb-4">Complaint Management</h3>

    <div class="card"><div class="card-body">

      <!-- Search, filter and buttons -->
      <div class="flex flex-col lg:flex-row gap-2 mb-3">
        <input type="text" id="searchComplaint" class="form-control lg:flex-1"
               placeholder="Search by ID, student, category or date..."
               oninput="complaintPage = 1; showComplaints()">

        <select id="filterStatus" class="form-select lg:w-auto" onchange="complaintPage = 1; showComplaints()">
          <option value="All">All Status</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
        </select>

        <button class="btn btn-outline-secondary" onclick="exportComplaints()">
          <i class="bi bi-download"></i> Export CSV
        </button>
        <button class="btn btn-primary" onclick="openAddComplaint()">
          <i class="bi bi-plus-circle"></i> Add Complaint
        </button>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>Complaint ID</th><th>Student Name</th><th>Category</th>
              <th>Date</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="complaintTable"></tbody>
        </table>
      </div>

      <div id="complaintPager"></div>
    </div></div>
  </main>

  <!-- Add / Edit Complaint Modal -->
  <div class="modal fade" id="complaintModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="complaintModalTitle">Add Complaint</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="complaintEditIndex">
          <div class="mb-3">
            <label class="form-label">Student Name</label>
            <input type="text" id="complaintStudent" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Complaint Category</label>
            <select id="complaintCategory" class="form-select">
              <option value="Electrical">Electrical</option>
              <option value="Plumbing">Plumbing</option>
              <option value="Furniture">Furniture</option>
              <option value="Cleanliness">Cleanliness</option>
              <option value="Internet">Internet</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" id="complaintDate" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Status</label>
            <select id="complaintStatus" class="form-select">
              <option value="Pending">Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" onclick="saveComplaint()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
